name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug event
        run: echo "Workflow triggered by ${{ github.event_name }} on ${{ github.ref }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test:run

      - name: Coverage
        run: npm run coverage

      - name: Browser smoke
        run: npm run test:e2e

      - name: Build
        run: npm run build
        env:
          CI: true
